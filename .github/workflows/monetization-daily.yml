name: Monetization Progress Snapshot
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monetization-daily
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      TG_WORK: C:\Users\Admin\tg_work
      TG_DATA: C:\Users\Admin\tg_data
      TG_PYMAKER: C:\Users\Admin\tg_code\trend-video-maker
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - name: Monetization snapshot
        working-directory: remotion-video
        run: python -X utf8 monetization.py