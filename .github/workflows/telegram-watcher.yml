name: Telegram Video Watcher
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      recover_message_ids:
        type: string
        required: false
        default: ''
        description: Comma-separated channel message ids to recover via forwardMessage
permissions:
  contents: read
concurrency:
  group: telegram-watcher
  cancel-in-progress: false
jobs:
  watch:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RECOVER_CHANNEL_MSGS: ${{ inputs.recover_message_ids || '' }}
      TG_WORK: C:\Users\Admin\tg_work
      TG_DATA: C:\Users\Admin\tg_data
      TG_PYMAKER: C:\Users\Admin\tg_code\trend-video-maker
      TG_ENFORCE_WINDOW: '1'
      TG_PUB_START: '18.5'
      TG_PUB_END: '24'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - name: Run telegram watcher
        working-directory: remotion-video
        run: python -X utf8 telegram_watcher.py