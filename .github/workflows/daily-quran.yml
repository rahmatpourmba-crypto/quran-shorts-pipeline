name: quran-daily-shorts

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 6 * * *'
    - cron: '30 12 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Videos to produce (9 = 3+3+3 trilingual)'
        required: true
        default: '9'
        type: choice
        options:
          - '9'
          - '6'
          - '3'
          - '1'
      now:
        description: 'Publish immediately (skip scheduled publish slots)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    env:
      QURAN_RECITER: aziz_alili_128kbps
      QURAN_RECITER_NAME: Aziz Alili
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python deps
        run: |
          pip install --disable-pip-version-check -q requests numpy pillow google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib imageio-ffmpeg mutagen

      - name: Install Node deps (remotion)
        working-directory: remotion-video
        run: npm ci

      - name: Verify Chrome
        run: |
          if (Test-Path 'C:\Program Files\Google\Chrome\Application\chrome.exe') { Write-Host 'chrome ok' } else { Write-Host 'CHROME MISSING'; exit 1 }

      - name: Restore OAuth token (secret)
        env:
          TOKEN_AUTH_B64: ${{ secrets.TOKEN_AUTH_B64 }}
        run: |
          if (-not $env:TOKEN_AUTH_B64) { Write-Host 'TOKEN_AUTH_B64 secret is empty'; exit 1 }
          [IO.File]::WriteAllBytes('trend-video-maker/token_aya.pickle', [Convert]::FromBase64String($env:TOKEN_AUTH_B64))
          python -c "import pickle;c=pickle.load(open('trend-video-maker/token_aya.pickle','rb'));print('token ok:',bool(getattr(c,'refresh_token',None)))"

      - name: Run daily pipeline
        working-directory: remotion-video
        run: |
          $count = '${{ github.event.inputs.count }}'
          if ($count -eq '') { $count = '9' }
          $now = '${{ github.event.inputs.now }}'
          if ($now -eq 'true') { $now = '--now' } else { $now = '' }
          python -u daily_quran_fm.py --count $count $now